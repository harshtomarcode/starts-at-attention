<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101513">
<meta name="description" content="An interactive graph of influential AI papers, from Attention Is All You Need to current architectures, reasoning, and GPU systems.">
<title>Starts at Attention</title>
<style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#101513;color:#e5efdf}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100dvh;touch-action:none;cursor:grab;outline-offset:-4px}canvas:focus-visible{outline:1px solid #b9ee8780}canvas.dragging{cursor:grabbing}.tooltip{position:fixed;pointer-events:none;z-index:2;max-width:min(355px,calc(100vw - 24px));padding:12px 15px;background:#1b241deb;border:1px solid #43533e;border-radius:7px;box-shadow:0 12px 30px #0004;line-height:1.55;font-size:14px;backdrop-filter:blur(10px)}.tooltip strong{font-weight:550}.tooltip small{display:block;color:#98ac95;font-size:12px;margin-top:5px}.tooltip p{margin:9px 0 0;color:#bbcbb5;font-size:13px}[hidden]{display:none!important}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<canvas id="graph" tabindex="0" aria-label="Research paper graph. Drag a bubble to play, drag empty space to pan, and scroll to zoom. Click a paper to highlight its lineage; double-click it or press Enter to read the source. Arrow keys move between papers. Home fits the full graph. Escape clears the selection." aria-describedby="graph-status"></canvas>
<div id="tooltip" class="tooltip" hidden></div>
<p id="graph-status" class="sr-only" role="status" aria-live="polite">Loading papers.</p>
<script>
'use strict';
const domains=[{id:'text',label:'Text / LLMs',color:'#b9ee87'},{id:'vision',label:'Vision',color:'#b8a5ef'},{id:'robotics',label:'Robotics',color:'#e9ab98'},{id:'systems',label:'Systems',color:'#e6c477'},{id:'benchmarks',label:'Benchmarks',color:'#91c6e6'}];
const canvas=document.getElementById('graph'),ctx=canvas.getContext('2d'),tooltip=document.getElementById('tooltip'),status=document.getElementById('graph-status');
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)'),fmt=new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}),detailChunks=new Map();
const state={papers:[],links:[],nodes:[],selected:'1706.03762',hover:null,zoom:1,panX:0,panY:0,drag:null};
let catalog={},byId=new Map(),nodeById=new Map(),width=0,height=0,minDate=0,maxDate=1,raf=0,frameTime=0,lastPaint=0,connected=new Set(),drawEdges=[],ranked=[],loading=true,errorMessage='';
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function scheduleDraw(){if(!raf&&!document.hidden)raf=requestAnimationFrame(()=>{raf=0;paint()})}
function point(n){const t=frameTime*.001,motion=reducedMotion.matches?0:1;return {x:(n.x-width/2)*state.zoom+width/2+state.panX+n.fx+motion*Math.sin(t*.85+n.phase)*2.1,y:(n.y-height/2)*state.zoom+height/2+state.panY+n.fy+motion*Math.cos(t*1.1+n.phase)*1.6-n.lift*2,r:n.r*Math.min(1.6,.75+state.zoom*.25)*(1+n.lift*.16)}}
function prepareScene(){
 connected=new Set([state.selected]);const important=[],background=[];
 for(const e of state.links){if(!nodeById.has(e.source)||!nodeById.has(e.target))continue;if(e.source===state.selected||e.target===state.selected){important.push(e);connected.add(e.source);connected.add(e.target)}else if(background.length<450)background.push(e)}
 drawEdges=[...background,...important];
 ranked=[...state.nodes].sort((a,b)=>Number(b.p.id===state.selected)-Number(a.p.id===state.selected)||(b.p.score??0)-(a.p.score??0));
}
function layout(){
 width=innerWidth;height=innerHeight;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
 const dates=state.papers.map(p=>Date.parse(p.date));minDate=dates.length?Math.min(...dates):Date.UTC(2017,0,1);maxDate=dates.length?Math.max(...dates):Date.now();if(minDate===maxDate){minDate-=86400000;maxDate+=86400000}
 const left=width<600?48:65,lane=(width-left-22)/5,usable=Math.max(height-140,100);
 state.nodes=state.papers.map(p=>{const index=domains.findIndex(d=>d.id===p.category);let hash=0;for(const c of p.id)hash=(hash*31+c.charCodeAt(0))>>>0;return {p,color:domains[index]?.color||domains[0].color,x:left+lane*(index+.5)+((hash%1000)/999-.5)*lane*.72,y:90+(Date.parse(p.date)-minDate)/(maxDate-minDate)*usable+((hash%7)-3)*2,r:p.citationCount==null?1.6:1.4+16.6*Math.sqrt(Math.min(1,p.citationCount/100000)),phase:hash*.013,fx:0,fy:0,vx:0,vy:0,lift:0}});
 state.nodes.sort((a,b)=>(a.p.score??0)-(b.p.score??0));nodeById=new Map(state.nodes.map(n=>[n.p.id,n]));prepareScene();scheduleDraw();
}
function paint(){
 const now=performance.now();if(now-lastPaint<30){scheduleDraw();return}lastPaint=now;frameTime=now;
 ctx.clearRect(0,0,width,height);ctx.fillStyle='#101513';ctx.fillRect(0,0,width,height);
 if(loading||errorMessage){ctx.font='14px -apple-system, sans-serif';ctx.fillStyle='#93a68b';ctx.textAlign='center';ctx.fillText(errorMessage||'Loading the graph…',width/2,height/2);return}
 const left=width<600?48:65,lane=(width-left-22)/5,usable=Math.max(height-140,100);
 for(const n of state.nodes){n.lift+=((n.p.id===state.hover?1:0)-n.lift)*.2;if(state.drag?.node!==n){n.vx=(-n.fx*.07+n.vx)*.76;n.vy=(-n.fy*.07+n.vy)*.76;n.fx+=n.vx;n.fy+=n.vy;if(Math.abs(n.fx)+Math.abs(n.fy)<.01){n.fx=0;n.fy=0;n.vx=0;n.vy=0}}}
 ctx.save();ctx.beginPath();ctx.rect(left,57,width-left,height-57);ctx.clip();
 for(let i=0;i<5;i++){const x=(left+lane*i-width/2)*state.zoom+width/2+state.panX;ctx.fillStyle=i%2?'#15201830':'#15201810';ctx.fillRect(x,57,lane*state.zoom,height);ctx.strokeStyle='#243228';ctx.beginPath();ctx.moveTo(x,57);ctx.lineTo(x,height);ctx.stroke()}
 for(let year=new Date(minDate).getUTCFullYear();year<=new Date(maxDate).getUTCFullYear();year++){const y=(90+(Date.UTC(year,0,1)-minDate)/(maxDate-minDate)*usable-height/2)*state.zoom+height/2+state.panY;if(y<67||y>height-10)continue;ctx.strokeStyle='#2a392c';ctx.setLineDash([2,6]);ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(width,y);ctx.stroke();ctx.setLineDash([])}
 for(const e of drawEdges){const a=point(nodeById.get(e.source)),b=point(nodeById.get(e.target)),highlight=e.source===state.selected||e.target===state.selected;if(Math.max(a.y,b.y)<57||Math.min(a.y,b.y)>height)continue;ctx.globalAlpha=highlight?.55:.065;ctx.strokeStyle=highlight?'#c0d7aa':'#829b7a';ctx.lineWidth=highlight?1.1:.7;ctx.setLineDash(e.type==='citation'?[]:[3,5]);const bend=Math.max(20,Math.abs(b.y-a.y)*.45);ctx.beginPath();ctx.moveTo(a.x,a.y+a.r);ctx.bezierCurveTo(a.x,a.y+bend,b.x,b.y-bend,b.x,b.y-b.r);ctx.stroke();ctx.setLineDash([]);if(highlight){ctx.beginPath();ctx.moveTo(b.x-2.5,b.y-b.r-4);ctx.lineTo(b.x,b.y-b.r);ctx.lineTo(b.x+2.5,b.y-b.r-4);ctx.stroke()}}
 ctx.globalAlpha=1;ctx.lineWidth=1;
 const selectedNode=nodeById.get(state.selected),renderNodes=selectedNode?[...state.nodes,selectedNode]:state.nodes;
 for(const n of renderNodes){const p=point(n);if(p.y<35||p.y>height+20||p.x<left-20||p.x>width+20)continue;const selected=n.p.id===state.selected,hover=n.p.id===state.hover;
  if(selected||hover){ctx.shadowColor=n.color;ctx.shadowBlur=14;ctx.globalAlpha=.12;ctx.fillStyle=n.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r+7,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=.7;ctx.strokeStyle=n.color;ctx.setLineDash(selected?[2,3]:[]);ctx.beginPath();ctx.arc(p.x,p.y,p.r+4,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}
  ctx.globalAlpha=selected||hover?1:connected.has(n.p.id)?.9:n.p.status==='candidate'?.32:.7;ctx.fillStyle=n.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();if(n.p.citationCount==null){ctx.fillStyle='#101513';ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1,p.r-1),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 }
 const boxes=[],hoverNode=nodeById.get(state.hover),labels=hoverNode?[hoverNode,...ranked.filter(n=>n!==hoverNode)]:ranked;
 for(const n of labels){if(boxes.length>=(state.zoom<1.25?24:65))break;const p=point(n);if(p.y<65||p.y>height-30||p.x<left||p.x>width-5)continue;const forced=n.p.id===state.selected||n.p.id===state.hover;ctx.font=(forced?'600 ':'400 ')+(forced?14:12)+'px -apple-system, sans-serif';let label=n.p.shortTitle||n.p.title;const max=Math.max(95,lane*Math.min(state.zoom,2)*1.1);while(label.length>12&&ctx.measureText(label).width>max)label=label.slice(0,-2);if(label!==(n.p.shortTitle||n.p.title))label+='…';const tw=ctx.measureText(label).width,x=Math.max(left+4,Math.min(width-tw-12,p.x-tw/2)),y=p.y+p.r+18,box={x:x-4,y:y-12,w:tw+8,h:forced?34:19};if(!forced&&boxes.some(b=>box.x<b.x+b.w&&box.x+box.w>b.x&&box.y<b.y+b.h&&box.y+box.h>b.y))continue;boxes.push(box);ctx.textAlign='left';ctx.fillStyle=forced?'#e6f0dd':'#a1b397';ctx.fillText(label,x,y);if(forced){ctx.font='12px Consolas, monospace';ctx.fillStyle='#728b68';ctx.fillText(n.p.date.slice(0,7),x,y+16)}}
 ctx.restore();ctx.fillStyle='#101513f5';ctx.fillRect(0,0,width,57);ctx.fillStyle='#101513';ctx.fillRect(0,57,left,height-57);
 ctx.font='12px Consolas, monospace';ctx.textAlign='left';ctx.fillStyle='#748b6d';
 for(let year=new Date(minDate).getUTCFullYear();year<=new Date(maxDate).getUTCFullYear();year++){const y=(90+(Date.UTC(year,0,1)-minDate)/(maxDate-minDate)*usable-height/2)*state.zoom+height/2+state.panY;if(y>67&&y<height-10)ctx.fillText(year,12,y+4)}
 ctx.textAlign='center';ctx.font='12px -apple-system, sans-serif';for(let i=0;i<5;i++){const x=(left+lane*(i+.5)-width/2)*state.zoom+width/2+state.panX;if(x<left||x>width)continue;ctx.fillStyle=domains[i].color;ctx.globalAlpha=.8;ctx.fillText(width<600?['LLMs','Vision','Robots','Systems','Evals'][i]:domains[i].label,x,33)}ctx.globalAlpha=1;
 if(!reducedMotion.matches||state.drag||state.nodes.some(n=>Math.abs(n.fx)+Math.abs(n.fy)>.01))scheduleDraw();
}
async function showTooltip(node,x,y){
 if(!node){tooltip.hidden=true;return}const p=node.p;tooltip.hidden=false;tooltip.innerHTML='<strong>'+esc(p.title)+'</strong><small>'+esc(p.date)+' · '+(p.citationCount==null?'Citation data pending':fmt.format(p.citationCount)+' indexed citations')+(p.status==='candidate'?' · emerging':'')+'</small>'+(p.summary?'<p>'+esc(p.summary)+'</p>':'')+'<small>Click to trace connections · Double-click to read</small>';tooltip.style.left=Math.max(12,Math.min(width-367,x+18))+'px';tooltip.style.top=Math.max(65,Math.min(height-tooltip.offsetHeight-15,y+22))+'px';
 if(p.detailFile&&!detailChunks.has(p.detailFile))detailChunks.set(p.detailFile,fetch(p.detailFile).then(r=>{if(!r.ok)throw new Error('Abstract unavailable');return r.json()}).catch(()=>null));
 if(p.detailFile){const details=await detailChunks.get(p.detailFile);if(details?.[p.id])Object.assign(p,details[p.id])}
}
function selectPaper(id,focus=false){
 if(!byId.has(id))throw new Error('Unknown paper ID');state.selected=id;prepareScene();if(focus){const n=nodeById.get(id);if(n){state.panY=height*.45-(n.y-height/2)*state.zoom-height/2;state.panX=0}}status.textContent=byId.get(id).title+'; '+byId.get(id).date;history.replaceState(null,'','#paper='+encodeURIComponent(id));scheduleDraw();
}
function resetGraph(){state.zoom=1;state.panX=0;state.panY=0;state.selected='1706.03762';state.hover=null;tooltip.hidden=true;prepareScene();history.replaceState(null,'',location.pathname+location.search);scheduleDraw()}
function openOriginal(id){const p=byId.get(id);if(!p)return;try{const url=new URL(p.source);if(url.protocol==='https:')window.open(url.href,'_blank','noopener')}catch{}}
function hitTest(x,y){let found=null,best=Infinity;if(y<57)return null;for(const n of state.nodes){const p=point(n),d=Math.hypot(x-p.x,y-p.y);if(d<Math.max(p.r+5,9)&&d<best){found=n;best=d}}return found}
function zoomBy(factor,x=width/2,y=height/2){const old=state.zoom;state.zoom=Math.max(.65,Math.min(12,old*factor));state.panX=x-width/2-(x-width/2-state.panX)*state.zoom/old;state.panY=y-height/2-(y-height/2-state.panY)*state.zoom/old;tooltip.hidden=true;scheduleDraw()}
canvas.addEventListener('wheel',e=>{e.preventDefault();zoomBy(Math.exp(-e.deltaY*.0018),e.clientX,e.clientY)},{passive:false});
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);const node=hitTest(e.clientX,e.clientY);state.drag={x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,node};if(node){node.vx=0;node.vy=0}canvas.classList.add('dragging');tooltip.hidden=true});
canvas.addEventListener('pointermove',e=>{if(state.drag){const dx=e.clientX-state.drag.x,dy=e.clientY-state.drag.y;if(state.drag.node){state.drag.node.fx+=dx;state.drag.node.fy+=dy}else{state.panX+=dx;state.panY+=dy}state.drag.x=e.clientX;state.drag.y=e.clientY;scheduleDraw();return}const n=hitTest(e.clientX,e.clientY);if(state.hover!==n?.p.id){state.hover=n?.p.id||null;showTooltip(n,e.clientX,e.clientY)}canvas.style.cursor=n?'pointer':'grab';scheduleDraw()});
canvas.addEventListener('pointerup',e=>{const drag=state.drag;if(drag&&Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)<7){const n=hitTest(e.clientX,e.clientY);if(n){selectPaper(n.p.id);showTooltip(n,e.clientX,e.clientY)}else{state.selected=null;tooltip.hidden=true;prepareScene()}}if(reducedMotion.matches&&drag?.node){drag.node.fx=0;drag.node.fy=0}state.drag=null;canvas.classList.remove('dragging');scheduleDraw()});
canvas.addEventListener('pointercancel',()=>{state.drag=null;canvas.classList.remove('dragging');scheduleDraw()});
canvas.addEventListener('pointerleave',()=>{state.hover=null;tooltip.hidden=true;scheduleDraw()});
canvas.addEventListener('dblclick',e=>{const n=hitTest(e.clientX,e.clientY);if(n)openOriginal(n.p.id);else resetGraph()});
canvas.addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();const offset=['ArrowDown','ArrowRight'].includes(e.key)?1:-1,index=state.papers.findIndex(p=>p.id===state.selected),p=state.papers[(index+offset+state.papers.length)%state.papers.length];if(p){selectPaper(p.id,true);const n=nodeById.get(p.id),at=point(n);showTooltip(n,at.x,at.y)}}if(e.key==='Enter')openOriginal(state.selected);if(e.key==='Home'){e.preventDefault();resetGraph()}if(e.key==='Escape'){state.selected=null;state.hover=null;tooltip.hidden=true;prepareScene();scheduleDraw()}if(e.key==='+'||e.key==='=')zoomBy(1.25);if(e.key==='-')zoomBy(.8)});
addEventListener('resize',layout);document.addEventListener('visibilitychange',()=>{if(!document.hidden)scheduleDraw()});
async function registerGraphTools(){
 if(!document.modelContext?.registerTool)return;const life=new AbortController();addEventListener('pagehide',()=>life.abort(),{once:true});
 const specs=[{name:'focus_paper',title:'Focus a paper on the graph',description:'Select and center a paper by catalog ID, highlighting its citation lineage just as clicking its bubble does. Returns the selected paper and connections.',inputSchema:{type:'object',properties:{id:{type:'string'}},required:['id'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:true},async execute(input){if(!input||typeof input.id!=='string'||Object.keys(input).some(k=>k!=='id')||!byId.has(input.id))throw new Error('Unknown paper ID');selectPaper(input.id,true);const n=nodeById.get(input.id),at=point(n);await showTooltip(n,at.x,at.y);await new Promise(requestAnimationFrame);const p=byId.get(input.id);return {selectedPaper:p.id,title:p.title,date:p.date,citationCount:p.citationCount,source:p.source,abstract:p.abstract||null,connections:connected.size-1,paperCount:state.papers.length}}},{name:'reset_graph',title:'Fit the full graph',description:'Restore the full research graph and Attention Is All You Need selection, like double-clicking empty space or pressing Home.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},async execute(input){if(!input||typeof input!=='object'||Array.isArray(input)||Object.keys(input).length)throw new Error('This action takes no arguments');resetGraph();await new Promise(requestAnimationFrame);return {selectedPaper:state.selected,paperCount:state.papers.length,zoom:state.zoom}}}];
 for(const tool of specs)try{await document.modelContext.registerTool(tool,{signal:life.signal})}catch(e){console.warn('Graph tool unavailable:',e.message)}
}
async function start(){
 layout();try{
  const base='https://raw.githubusercontent.com/harshtomarcode/starts-at-attention/main/',hosted=!['localhost','127.0.0.1','::1'].includes(location.hostname);
  const bundled=fetch('./data/papers.json').then(r=>{if(!r.ok)throw new Error('Collection unavailable');return r.json()});
  const remote=hosted?fetch(base+'data/papers.json',{signal:AbortSignal.timeout(5000)}).then(r=>{if(!r.ok)throw new Error('Live data unavailable');return r.json()}):Promise.resolve(null);
  const results=await Promise.allSettled([bundled,remote]),local=results[0].status==='fulfilled'?results[0].value:null,live=results[1].status==='fulfilled'?results[1].value:null,useLive=live?.papers?.length&&(!local||live.updatedAt>=local.updatedAt);
  catalog=useLive?live:local;if(!catalog?.papers?.length)throw new Error('Collection unavailable');if(useLive)for(const p of catalog.papers)p.detailFile=new URL(p.detailFile,base).href;
  state.papers=catalog.papers.filter(p=>p.status!=='archived').sort((a,b)=>a.date.localeCompare(b.date));state.links=catalog.links||[];byId=new Map(state.papers.map(p=>[p.id,p]));const selected=new URLSearchParams(location.hash.slice(1)).get('paper');if(selected&&byId.has(selected))state.selected=selected;
  loading=false;status.textContent=state.papers.length+' papers; through '+state.papers.at(-1).date+'. Solid lines are verified citations; dashed lines are learning prerequisites.';layout();await registerGraphTools();
 }catch(e){loading=false;errorMessage='The graph could not load. Refresh to try again.';status.textContent=errorMessage;scheduleDraw();console.error(e)}
}
start();
</script>
</body>
</html>

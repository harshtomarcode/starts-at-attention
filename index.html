const chapters=[{"id":"1706.03762","headline":"Attention replaces recurrence in sequence modeling","body":"The Transformer builds sequence models from attention and feed-forward layers. Tokens can be processed in parallel during training, establishing the architecture that much of this map grows from."},{"id":"1810.04805","headline":"Pretraining makes language representations broadly reusable","body":"BERT learns from text on both sides of a masked word. A shared pretrained encoder can then adapt to many language understanding tasks with relatively small task-specific changes."},{"id":"gpt-2","headline":"Next-token prediction begins to support many tasks","body":"GPT-2 studies how a language model trained on web text can perform tasks through prompting. Training one predictor begins to offer an alternative to building a separate model for every task."},{"id":"2005.14165","headline":"Examples in the prompt become a learning interface","body":"GPT-3 evaluates tasks using instructions and demonstrations placed in context. Its weights stay fixed while the prompt specifies what to do, making in-context learning a central research question."},{"id":"2010.11929","headline":"Images become sequences that Transformers can read","body":"Vision Transformer divides images into patches and processes them with a Transformer. Large-scale pretraining shows that this sequence architecture can work well for image recognition too."},{"id":"2101.03961","headline":"Larger models need not activate every parameter","body":"Switch Transformer sends each token to one expert. Sparse routing separates total model capacity from computation per token, while exposing new questions about training stability and communication."},{"id":"2201.11903","headline":"Intermediate steps become part of the prompt","body":"Chain-of-thought prompting includes worked reasoning in its examples. On the evaluated multistep tasks, sufficiently large models benefit from producing intermediate steps before an answer."},{"id":"2203.02155","headline":"Human feedback reshapes what models optimize","body":"InstructGPT combines demonstrations, preference comparisons, and reinforcement learning. Predicting plausible text and following a user’s intent become distinct objectives within the model-development process."},{"id":"2203.15556","headline":"Training data changes the scaling equation","body":"Chinchilla reexamines how to spend a fixed training budget. Its experiments show why parameter count and training tokens must be chosen together, rather than increasing model size alone."},{"id":"2205.14135","headline":"Attention gets faster by moving less data","body":"FlashAttention reorganizes exact attention around the GPU memory hierarchy. Tiling reduces memory transfers, demonstrating why the way an algorithm moves data can matter as much as its arithmetic."},{"id":"2212.06817","headline":"Transformer policies learn across many robot tasks","body":"RT-1 trains on diverse demonstrations collected from real robots. It studies how a shared policy generalizes as the amount and variety of robot experience increase."},{"id":"2302.13971","headline":"Shared model weights broaden the research baseline","body":"LLaMA releases a family of pretrained models to researchers and documents training on publicly available data. Smaller model sizes trained on substantial data become practical starting points for further study."},{"id":"2305.18290","headline":"Preferences can train a model more directly","body":"DPO turns preference comparisons into a direct training objective. Its formulation connects alignment to a simpler loss, avoiding separate reward-model training and online reinforcement learning in the studied setup."},{"id":"2309.06180","headline":"Serving capacity depends on managing model memory","body":"PagedAttention organizes the growing attention cache into reusable blocks. The vLLM system uses this approach to reduce wasted memory and serve larger batches of requests."},{"id":"2312.00752","headline":"Selective state offers another way to model sequences","body":"Mamba makes its recurrent state updates depend on the current input. The model can retain or forget information without attending over every earlier token, opening a different architecture branch."},{"id":"2405.04434","headline":"Attention compression meets more specialized model experts","body":"DeepSeek-V2 combines latent attention with DeepSeekMoE. Compressing cached attention state and routing tokens among specialized experts address different parts of the cost of running a large language model."},{"id":"2412.19437","headline":"Expert balancing and prediction objectives evolve together","body":"DeepSeek-V3 adds auxiliary-loss-free expert balancing and multi-token prediction to its existing architecture. The report connects these model choices with precision, data, and distributed training."},{"id":"2501.12948","headline":"Reinforcement learning trains longer reasoning behavior","body":"DeepSeek-R1 investigates learning reasoning through reinforcement learning, including a variant without reasoning demonstrations. Its experiments also show how reasoning behavior can be transferred into smaller models through distillation."},{"id":"2505.09388","headline":"Reasoning effort becomes a controllable model behavior","body":"Qwen3 combines thinking and non-thinking modes within the same model family. Its training and inference design makes the amount of reasoning compute an explicit choice."},{"id":"2601.07372","headline":"Conditional memory adds another axis of model capacity","body":"Engram introduces n-gram memory lookups alongside neural computation. The paper studies how a model’s capacity can be divided between retrieving stored representations and activating experts."},{"id":"2606.19348","headline":"Long contexts reshape attention and residual connections","body":"DeepSeek-V4 combines compressed attention, constrained residual connections, and a different optimizer. Its million-token context design brings architecture, memory cost, and training stability into the same set of decisions."},{"id":"2608.30320","headline":"Hybrid architectures balance quality, cost, and stability","body":"Qwen3.8-Next combines gated delta layers, sparse attention, widened residual streams, and n-gram memory. Its ablations examine downstream accuracy alongside efficiency and optimization stability when choosing the architecture."}];

const timeline=document.getElementById('timeline'),chapter=document.getElementById('chapter');
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)'),fmt=new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}),detailChunks=new Map();
const state={papers:[],links:[],nodes:[],selected:'1706.03762',hover:null,zoom:1,panX:0,drag:null};
let catalog={},byId=new Map(),nodeById=new Map(),width=0,height=0,minDate=0,maxDate=1,raf=0,frameTime=0,lastPaint=0,connected=new Set(),drawEdges=[],ranked=[],loading=true,errorMessage='',monthHeight=180,worldHeight=1000,currentChapter='';

 drawEdges=[...background,...important];

function layout(){

 const left=width<600?58:76,lane=(width-left-22)/5;monthHeight=Math.max(65,(height-57)/7);const usable=(maxDate-minDate)/86400000/30.4375*monthHeight;worldHeight=usable+height;timeline.style.height=worldHeight*state.zoom+'px';
 state.nodes=state.papers.map(p=>{const index=domains.findIndex(d=>d.id===p.category);let hash=0;for(const c of p.id)hash=(hash*31+c.charCodeAt(0))>>>0;return {p,color:domains[index]?.color||domains[0].color,x:left+lane*(index+.5)+((hash%1000)/999-.5)*lane*.72,y:90+(Date.parse(p.date)-minDate)/(maxDate-minDate)*usable+((hash%7)-3)*2,r:p.score==null?1.6:1.4+16.6*Math.sqrt(Math.max(0,Math.min(1,p.score/100))),phase:hash*.013,fx:0,fy:0,vx:0,vy:0,lift:0}});
 state.nodes.sort((a,b)=>(a.p.score??0)-(b.p.score??0));nodeById=new Map(state.nodes.map(n=>[n.p.id,n]));prepareScene();scheduleDraw();
}
function paint(){
 const now=performance.now();if(now-lastPaint<30){scheduleDraw();return}lastPaint=now;frameTime=now;
 ctx.clearRect(0,0,width,height);ctx.fillStyle='#101513';ctx.fillRect(0,0,width,height);

 const left=width<600?58:76,lane=(width-left-22)/5,usable=(maxDate-minDate)/86400000/30.4375*monthHeight;
 for(const n of state.nodes){n.lift+=((n.p.id===state.hover?1:0)-n.lift)*.2;if(state.drag?.node!==n){n.vx=(-n.fx*.07+n.vx)*.76;n.vy=(-n.fy*.07+n.vy)*.76;n.fx+=n.vx;n.fy+=n.vy;if(Math.abs(n.fx)+Math.abs(n.fy)<.01){n.fx=0;n.fy=0;n.vx=0;n.vy=0}}}
 ctx.save();ctx.beginPath();ctx.rect(left,57,width-left,height-57);ctx.clip();
 let edgeCount=0;for(const e of drawEdges){const a=point(nodeById.get(e.source)),b=point(nodeById.get(e.target)),highlight=e.source===state.selected||e.target===state.selected;const aVisible=a.y>=57&&a.y<=height,bVisible=b.y>=57&&b.y<=height;if(!aVisible&&!bVisible)continue;if(!highlight&&edgeCount++>160)continue;ctx.globalAlpha=highlight?(aVisible&&bVisible?.55:.13):(aVisible&&bVisible?.1:.025);ctx.strokeStyle=highlight?'#c0d7aa':'#829b7a';ctx.lineWidth=highlight?1.1:.7;ctx.setLineDash(e.type==='citation'?[]:[3,5]);const bend=Math.max(20,Math.abs(b.y-a.y)*.45);ctx.beginPath();ctx.moveTo(a.x,a.y+a.r);ctx.bezierCurveTo(a.x,a.y+bend,b.x,b.y-bend,b.x,b.y-b.r);ctx.stroke();ctx.setLineDash([]);if(highlight){ctx.beginPath();ctx.moveTo(b.x-2.5,b.y-b.r-4);ctx.lineTo(b.x,b.y-b.r);ctx.lineTo(b.x+2.5,b.y-b.r-4);ctx.stroke()}}
 ctx.globalAlpha=1;ctx.lineWidth=1;
 const selectedNode=nodeById.get(state.selected),renderNodes=selectedNode?[...state.nodes,selectedNode]:state.nodes;
 for(const n of renderNodes){const p=point(n);if(p.y<35||p.y>height+20||p.x<left-20||p.x>width+20)continue;const selected=n.p.id===state.selected,hover=n.p.id===state.hover;
  if(selected||hover){ctx.shadowColor=n.color;ctx.shadowBlur=14;ctx.globalAlpha=.12;ctx.fillStyle=n.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r+7,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=.7;ctx.strokeStyle=n.color;ctx.setLineDash(selected?[2,3]:[]);ctx.beginPath();ctx.arc(p.x,p.y,p.r+4,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}
  ctx.globalAlpha=selected||hover?1:connected.has(n.p.id)?.9:n.p.status==='candidate'?.32:.7;ctx.fillStyle=n.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();if(n.p.citationCount==null){ctx.fillStyle='#101513';ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1,p.r-1),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 }
 const boxes=[],hoverNode=nodeById.get(state.hover),labels=hoverNode?[hoverNode,...ranked.filter(n=>n!==hoverNode)]:ranked;
 for(const n of labels){if(boxes.length>=(state.zoom<1.25?24:65))break;const p=point(n);if(p.y<65||p.y>height-30||p.x<left||p.x>width-5)continue;const forced=n.p.id===state.selected||n.p.id===state.hover;ctx.font=(forced?'600 ':'400 ')+(forced?14:12)+'px -apple-system, sans-serif';let label=n.p.shortTitle||n.p.title;const max=Math.max(95,lane*Math.min(state.zoom,2)*1.1);while(label.length>12&&ctx.measureText(label).width>max)label=label.slice(0,-2);if(label!==(n.p.shortTitle||n.p.title))label+='…';const tw=ctx.measureText(label).width,x=Math.max(left+4,Math.min(width-tw-12,p.x-tw/2)),y=p.y+p.r+18,box={x:x-4,y:y-12,w:tw+8,h:forced?34:19};if(!forced&&boxes.some(b=>box.x<b.x+b.w&&box.x+box.w>b.x&&box.y<b.y+b.h&&box.y+box.h>b.y))continue;boxes.push(box);ctx.textAlign='left';ctx.fillStyle=forced?'#e6f0dd':'#a1b397';ctx.fillText(label,x,y);if(forced){ctx.font='12px Consolas, monospace';ctx.fillStyle='#728b68';ctx.fillText(n.p.date.slice(0,7),x,y+16)}}
 ctx.restore();ctx.fillStyle='#101513f5';ctx.fillRect(0,0,width,57);ctx.fillStyle='#101513';ctx.fillRect(0,57,left,height-57);

 for(let date=new Date(Date.UTC(new Date(minDate).getUTCFullYear(),new Date(minDate).getUTCMonth(),1));date.getTime()<=maxDate+32*86400000;date.setUTCMonth(date.getUTCMonth()+1)){const y=(90+(date.getTime()-minDate)/(maxDate-minDate)*usable)*state.zoom-scrollY;if(y>67&&y<height-10)ctx.fillText(date.toLocaleDateString('en-US',{month:'short',year:'2-digit',timeZone:'UTC'}),12,y+4)}

async function showTooltip(node,x,y){
 if(!node){tooltip.hidden=true;return}const p=node.p,parts=p.scoreComponents,provisional=(parts?.reputationWeight??0)>0&&(parts?.reputationSignal??0)>0;
 const reputationSources=[...(parts?.prominentLabs||[]),...(parts?.prominentAuthors||[]),...(parts?.indexedAuthor?[parts.indexedAuthor.name+' (h-index '+parts.indexedAuthor.hIndex+')']:[])];
 const weightText=parts?.citationWeight!=null?Math.round(parts.citationWeight*100)+'% citations · '+Math.round(parts.reputationWeight*100)+'% authors / companies':'';
 const scoreText=p.score==null?'Consequentiality pending':'Consequentiality '+p.score.toFixed(2)+' / 100'+(provisional?' · provisional':'');

 if(p.detailFile&&!detailChunks.has(p.detailFile))detailChunks.set(p.detailFile,fetch(p.detailFile).then(r=>{if(!r.ok)throw new Error('Abstract unavailable');return r.json()}).catch(()=>null));

}
function selectPaper(id,focus=false){
 if(!byId.has(id))throw new Error('Unknown paper ID');state.selected=id;prepareScene();if(focus){const n=nodeById.get(id);if(n){state.panX=0;scrollTo(0,n.y*state.zoom-height*.36);updateChapter()}}status.textContent=byId.get(id).title+'; '+byId.get(id).date;history.replaceState(null,'','#paper='+encodeURIComponent(id));scheduleDraw();
}
function resetGraph(){state.zoom=1;state.panX=0;state.hover=null;tooltip.hidden=true;timeline.style.height=worldHeight+'px';selectPaper('1706.03762',true);history.replaceState(null,'',location.pathname+location.search);scheduleDraw()}
function openOriginal(id){const p=byId.get(id);if(!p)return;try{const url=new URL(p.source);if(url.protocol==='https:')window.open(url.href,'_blank','noopener')}catch{}}
function hitTest(x,y){let found=null,best=Infinity;if(y<57)return null;for(const n of state.nodes){const p=point(n),d=Math.hypot(x-p.x,y-p.y);if(d<Math.max(p.r+5,9)&&d<best){found=n;best=d}}return found}

canvas.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();zoomBy(Math.exp(-e.deltaY*.0018),e.clientX,e.clientY)}},{passive:false});
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);const node=hitTest(e.clientX,e.clientY);state.drag={x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,node};if(node){node.vx=0;node.vy=0}canvas.classList.add('dragging');tooltip.hidden=true});

canvas.addEventListener('pointerup',e=>{const drag=state.drag;if(drag&&Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)<7){const n=hitTest(e.clientX,e.clientY);if(n){selectPaper(n.p.id);showTooltip(n,e.clientX,e.clientY)}else{state.selected=null;tooltip.hidden=true;prepareScene()}}if(reducedMotion.matches&&drag?.node){drag.node.fx=0;drag.node.fy=0}state.drag=null;canvas.classList.remove('dragging');scheduleDraw()});
canvas.addEventListener('pointercancel',()=>{state.drag=null;canvas.classList.remove('dragging');scheduleDraw()});

canvas.addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();const offset=['ArrowDown','ArrowRight'].includes(e.key)?1:-1,index=state.papers.findIndex(p=>p.id===state.selected),p=state.papers[(index+offset+state.papers.length)%state.papers.length];if(p){selectPaper(p.id,true);const n=nodeById.get(p.id),at=point(n);showTooltip(n,at.x,at.y)}}if(e.key==='Enter')openOriginal(state.selected);if(e.key==='Home'){e.preventDefault();resetGraph()}if(e.key==='Escape'){state.selected=null;state.hover=null;tooltip.hidden=true;prepareScene();scheduleDraw()}if(e.key==='+'||e.key==='=')zoomBy(1.25);if(e.key==='-')zoomBy(.8)});
addEventListener('resize',()=>{layout();updateChapter()});addEventListener('scroll',()=>{state.hover=null;tooltip.hidden=true;updateChapter();scheduleDraw()},{passive:true});document.addEventListener('visibilitychange',()=>{if(!document.hidden)scheduleDraw()});
function updateChapter(){
 if(loading||!state.papers.length)return;
 const center=minDate+((scrollY+height*.46)/state.zoom-90)/monthHeight*30.4375*86400000;
 const candidates=chapters.map(c=>({...c,p:byId.get(c.id)})).filter(c=>c.p&&Date.parse(c.p.date)<=center+25*86400000).sort((a,b)=>a.p.date.localeCompare(b.p.date));
 const chosen=candidates.at(-1);if(!chosen){chapter.hidden=true;return}chapter.hidden=false;
 if(currentChapter===chosen.id)return;currentChapter=chosen.id;chapter.innerHTML='<small>'+esc(new Date(chosen.p.date+'T12:00:00Z').toLocaleDateString('en-US',{month:'long',year:'numeric',timeZone:'UTC'}))+'</small><h1>'+esc(chosen.headline)+'</h1><p>'+esc(chosen.body)+'</p><p class="source">'+esc(chosen.p.shortTitle||chosen.p.title)+'</p>';
}
async function registerGraphTools(){
 if(!document.modelContext?.registerTool)return;const life=new AbortController();addEventListener('pagehide',()=>life.abort(),{once:true});
 const specs=[{name:'focus_paper',title:'Focus a paper on the graph',description:'Select and center a paper by catalog ID, highlighting its citation lineage just as clicking its bubble does. Returns the selected paper and connections.',inputSchema:{type:'object',properties:{id:{type:'string'}},required:['id'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:true},async execute(input){if(!input||typeof input.id!=='string'||Object.keys(input).some(k=>k!=='id')||!byId.has(input.id))throw new Error('Unknown paper ID');selectPaper(input.id,true);const n=nodeById.get(input.id),at=point(n);await showTooltip(n,at.x,at.y);await new Promise(requestAnimationFrame);const p=byId.get(input.id);return {selectedPaper:p.id,title:p.title,date:p.date,citationCount:p.citationCount,score:p.score,scoreBasis:p.scoreBasis,scoreComponents:p.scoreComponents,selectionBasis:p.selectionBasis,selectionReason:p.selectionReason,source:p.source,abstract:p.abstract||null,connections:connected.size-1,paperCount:state.papers.length,chapter:chapter.textContent}}},{name:'reset_graph',title:'Return to the beginning',description:'Restore the seven-month timeline scale and scroll to Attention Is All You Need, like double-clicking empty space or pressing Home.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},async execute(input){if(!input||typeof input!=='object'||Array.isArray(input)||Object.keys(input).length)throw new Error('This action takes no arguments');resetGraph();await new Promise(requestAnimationFrame);return {selectedPaper:state.selected,paperCount:state.papers.length,trackedPaperCount:catalog.papers.length,cutoff:catalog.cutoff,categoryCutoffs:catalog.categoryCutoffs,targetPaperCount:catalog.selectionCalibration?.targetVisible,recentMonths:catalog.recentMonths,zoom:state.zoom,visibleMonths:Number(((height-57)/monthHeight/state.zoom).toFixed(1)),chapter:chapter.textContent}}}];
 for(const tool of specs)try{await document.modelContext.registerTool(tool,{signal:life.signal})}catch(e){console.warn('Graph tool unavailable:',e.message)}
}
async function start(){
 layout();try{
  const base='https://raw.githubusercontent.com/harshtomarcode/starts-at-attention/main/',hosted=!['localhost','127.0.0.1','::1'].includes(location.hostname);
  const bundled=fetch('./data/papers.json').then(r=>{if(!r.ok)throw new Error('Collection unavailable');return r.json()});
  const remote=hosted?fetch(base+'data/papers.json',{signal:AbortSignal.timeout(5000)}).then(r=>{if(!r.ok)throw new Error('Live data unavailable');return r.json()}):Promise.resolve(null);
  const results=await Promise.allSettled([bundled,remote]),local=results[0].status==='fulfilled'?results[0].value:null,live=results[1].status==='fulfilled'?results[1].value:null,useLive=live?.papers?.length&&(!local||live.updatedAt>=local.updatedAt);
  catalog=useLive?live:local;if(!catalog?.papers?.length)throw new Error('Collection unavailable');if(useLive)for(const p of catalog.papers)p.detailFile=new URL(p.detailFile,base).href;
  state.papers=catalog.papers.filter(p=>p.status!=='archived').sort((a,b)=>a.date.localeCompare(b.date));state.links=catalog.links||[];byId=new Map(state.papers.map(p=>[p.id,p]));const selected=new URLSearchParams(location.hash.slice(1)).get('paper');if(selected&&byId.has(selected))state.selected=selected;
  loading=false;status.textContent=state.papers.length+' papers; through '+state.papers.at(-1).date+'. Solid lines are verified citations; dashed lines are learning prerequisites.';layout();selectPaper(state.selected,true);updateChapter();await registerGraphTools();
 }catch(e){loading=false;errorMessage='The graph could not load. Refresh to try again.';status.textContent=errorMessage;scheduleDraw();console.error(e)}
}
start();
</script>

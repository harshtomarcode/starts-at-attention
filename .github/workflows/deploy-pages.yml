name: Publish research atlas

on:
  push:
    branches: [main]
    paths: [index.html, update.py, 'data/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:
  # Commits made by the updater's GITHUB_TOKEN do not trigger push workflows.
  workflow_run:
    workflows: ['Update research atlas']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Build the static graph
        run: python3 update.py --build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

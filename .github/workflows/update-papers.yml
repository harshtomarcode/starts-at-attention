name: Update research atlas

on:
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [update.py, '.github/workflows/update-papers.yml']

permissions:
  contents: write

concurrency:
  group: paper-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Discover papers and refresh the full collection
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: python3 -u update.py --discover --refresh --limit 3000 --build
      - name: Save successful updates
        run: |
          git add data/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh research papers and impact scores'
            git pull --rebase origin main
            git push
          fi
